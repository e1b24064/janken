<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>じゃんけん 試合</title>
</head>

<body>
  <h1>試合</h1>
  <p>[[${loginUser}]] vs [[${opponent.name}]]</p>

  <div th:if="${opponent.name == 'CPU'}">
    <a href="/fight?hand=Gu">Gu</a>
    <a href="/fight?hand=Choki">Choki</a>
    <a href="/fight?hand=Pa">Pa</a>
  </div>

  <div th:unless="${opponent.name == 'CPU'}">
    <a th:href="@{/wait(id=${opponent.id}, hand='Gu')}">Gu</a>
    <a th:href="@{/wait(id=${opponent.id}, hand='Choki')}">Choki</a>
    <a th:href="@{/wait(id=${opponent.id}, hand='Pa')}">Pa</a>
  </div>

  <div>[[${loginUser}]]の手:[[${userHand}]]</div>
  <div>[[${opponent.name}]]の手:[[${cpuHand}]]</div>
  <div>結果:[[${result}]]</div>

  <a href="/janken">もどる</a>
</body>

</html>
